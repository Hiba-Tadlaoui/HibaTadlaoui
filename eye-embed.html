<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eye</title>
  <!--
    Standalone animated "eye" (the U of VISUAL).
    Wix: Add → Embed Code → Embed HTML → paste this whole file → size the box
    to a 3:4 ratio (e.g. 90 × 120). The eye scales to fill the box.
  -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .ht-eye {
      display: block;
      width: 100%;
      height: 100%;
    }

    .ht-eye__pupil {
      transition: transform 0.5s cubic-bezier(0.45, 0, 0.2, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .ht-eye__pupil {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <svg class="ht-eye" viewBox="0 0 90 120" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Eye">
    <defs>
      <!-- Outline of the "U" (a shield shape) -->
      <clipPath id="ht-eye-shape">
        <path d="M0 0 H90 V82 C90 106 70 120 45 120 C20 120 0 106 0 82 Z" />
      </clipPath>
      <!-- Red iris: the pupil can only be seen inside this circle -->
      <clipPath id="ht-eye-iris">
        <circle cx="46" cy="95" r="26" />
      </clipPath>
    </defs>

    <g clip-path="url(#ht-eye-shape)">
      <rect width="90" height="120" fill="#AC0000" />
      <!-- white of the eye -->
      <circle cx="45.5" cy="102" r="40.5" fill="#F0EEE9" />
      <!-- iris -->
      <circle cx="46" cy="95" r="26" fill="#AC0000" />
      <!-- pupil (animated) -->
      <g clip-path="url(#ht-eye-iris)">
        <circle class="ht-eye__pupil" cx="46" cy="95" r="13.5" fill="#F0EEE9" />
      </g>
    </g>
  </svg>

  <script>
    // The white pupil looks around inside the red iris.
    (function () {
      const pupil = document.querySelector(".ht-eye__pupil");
      if (!pupil) return;

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

      // Iris r = 26, pupil r = 13.5 → the pupil can travel 12.5 units from centre.
      const MAX_TRAVEL = 12.5;
      // Resting pose: looking down.
      const REST = { x: 1, y: 12.5 };

      // A few deliberate glances mixed into the random ones.
      const GLANCES = [
        { x: -12.5, y: 0 }, // left
        { x: 12.5, y: 0 },  // right
        { x: 0, y: -12.5 }, // up
        { x: -9, y: -9 },   // up-left
        { x: 9, y: -9 },    // up-right
        { x: 0, y: 0 },     // straight ahead
        REST,
      ];

      const lookAt = ({ x, y }) => {
        pupil.style.transform = `translate(${x}px, ${y}px)`;
      };

      const randomPoint = () => {
        const angle = Math.random() * Math.PI * 2;
        const dist = MAX_TRAVEL * (0.55 + Math.random() * 0.45);
        return { x: Math.cos(angle) * dist, y: Math.sin(angle) * dist };
      };

      const nextTarget = () =>
        Math.random() < 0.5
          ? GLANCES[Math.floor(Math.random() * GLANCES.length)]
          : randomPoint();

      let timer;
      const loop = () => {
        lookAt(nextTarget());
        // Hold each glance for a moment: sometimes a quick dart, sometimes a long stare.
        const hold = Math.random() < 0.25 ? 350 : 900 + Math.random() * 1400;
        timer = setTimeout(loop, hold);
      };

      const start = () => {
        clearTimeout(timer);
        lookAt(REST);
        if (reduceMotion.matches) return;
        timer = setTimeout(loop, 800);
      };

      reduceMotion.addEventListener("change", start);
      start();
    })();
  </script>
</body>
</html>
